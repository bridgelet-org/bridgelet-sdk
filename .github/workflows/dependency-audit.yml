name: Dependency Audit

on:
  pull_request:
    branches: ['main', 'develop']

jobs:
  audit:
    name: npm audit (high/critical blocks merge)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit (high/critical)
        # @stellar/stellar-sdk's pin is managed separately (see package.json)
        # and is exempt from this gate; any other high/critical advisory
        # fails the job. Suppressing an exempt package requires updating
        # the --omit list below plus a note in SECURITY_AUDIT.md — no ad-hoc
        # suppression.
        run: npm audit --audit-level=high --omit=dev
